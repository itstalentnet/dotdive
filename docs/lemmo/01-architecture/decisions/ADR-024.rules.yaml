version: 6.0.0
adr: ADR-024
last_updated: '2026-10-18'
total_rules: 50
rules:
- id: SB-DIR-01
  name: Clean Architecture Layering Standard
  requirement: وجود پوشه‌های مجزای internal/domain (موجودیت‌های ناب دامنه)، internal/app (یوزکیس‌ها و سرویس‌های کاربردی)،
    internal/ports (اینترفیس‌های ورودی و خروجی) و internal/adapters (پیاده‌سازی آداپتورهای HTTP، gRPC و پایگاه داده).
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-007-backend-contracts-and-tooling-standards.md §۳, dotdive/docs/lemmo/03-backend/style-guide.md
    §3
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DIR-02
  name: Thin Entrypoint Pattern
  requirement: وجود فایل تک‌منظوره cmd/main.go صرفاً جهت سیم‌کشی وابستگی‌ها و فراخوانی لایف‌سایکل بوت‌استرپ مشترک؛ منع پیاده‌سازی
    لاجیک بیزینسی، هندلرهای مستقیم یا محاسبات دامنه در این فایل.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: ast
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/03-backend/style-guide.md §3
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DIR-03
  name: Independent Go Module Isolation
  requirement: وجود فایل معتبر go.mod در ریشه سرویس با ماژول مستقل و پیشوند رسمی github.com/lemmo-lab/api/services/<name>
    بدون وابستگی مستقیم به کدهای داخلی سایر سرویس‌ها.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/03-backend/architecture.md §۱, dotdive/docs/lemmo/03-backend/style-guide.md §3
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DIR-04
  name: Database Migrations Parity
  requirement: وجود پوشه migrations/ حاوی فایل‌های مهاجرت با نام‌گذاری ترتیبی صفرپرشده عددی ۶رقمی زوج (up.sql و down.sql)
    یا وجود نشانگر صریح migrations/.no_migration در غیاب دیتابیس.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.storage.postgres == true
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-007-backend-contracts-and-tooling-standards.md §۳, dotdive/docs/lemmo/03-backend/style-guide.md
    §6
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DOC-01
  name: Service Architectural Identity File
  requirement: وجود فایل service.md در ریشه سرویس جهت شرح معماری، اهداف، مسئولیت‌های دامنه و مرزها؛ متادیتای فنی ماشین‌خوان
    منحصراً از مانیفست سرویس استخراج می‌شود.
  check: static
  scope: service
  applies_to:
  - go-service
  - packaged-engine
  - planned-stub
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: frontmatter_parse
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-007-backend-contracts-and-tooling-standards.md §۳, dotdive/docs/lemmo/03-backend/services.md
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-MAN-01
  name: Machine-Readable Service Manifest
  requirement: وجود فایل مانیفست معتبر service.manifest.yaml در ریشه سرویس منطبق بر اسکیمای استاندارد مانیفست به عنوان مرجع
    حقیقت (SSOT) متادیتای ماشینی سرویس و برقراری انطباق چهارجانبه.
  check: static
  scope: service
  applies_to:
  - go-service
  - packaged-engine
  - planned-stub
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: json_schema
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-024-service-blueprint-and-conformance.md §۳
  doc_status: draft_source
  enforced_by: lemmo-cli check
- id: SB-CFG-01
  name: Versioned Configuration Default File
  requirement: وجود فایل config/default.yaml در ریشه سرویس برای نگه‌داری پیش‌فرض‌های غیرحساس و تغییرپذیر و بارگذاری انحصاری
    کانفیگ از طریق پکیج متمرکز core/config.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/configuration-and-secrets.md §۱.۲
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CFG-02
  name: Startup Fail-Fast Validation
  requirement: پیاده‌سازی اینترفیس config.Validator بر روی ساختار پیکربندی سرویس جهت توقف فوری فرآیند استارت سرویس با ثبت
    لاگ ساختاریافته خطا و کد خروج ۱ در صورت کانفیگ نامعتبر.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: ast
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/01-architecture/configuration-and-secrets.md §۲
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CFG-03
  name: Secret Hardcoding Fallback Ban
  requirement: ممنوعیت مطلق قرار دادن مقادیر پیش‌فرض یا fallback در سورس‌کد برای سکرت‌های حساس (رمز دیتابیس، کلید S3، توکن
    JWT و API Keyها) و الزام توقف فوری سرویس در غیاب آن‌ها.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: ast
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/01-architecture/configuration-and-secrets.md §۲, dotdive/docs/lemmo/01-architecture/configuration-and-secrets.md
    §۳
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CFG-04
  name: Network Literal Constants Ban
  requirement: ممنوعیت استفاده از پورت‌ها یا آدرس‌های هاست هاردکدشده لیترال در فراخوانی‌های Listen و Dial در سورس‌کد؛ مقادیر
    متغیر محیطی باید از ساختار تایپ‌شده کانفیگ خوانده شوند.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: partial
  implementation_status: not_started
  evaluation_mechanism: ast_and_manual_review
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/configuration-and-secrets.md §۳, dotdive/docs/lemmo/01-architecture/decisions/ADR-009-service-owned-deployment-and-financial-ledger.md
    §۲.۴
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DEP-01
  name: Service-Owned Deployment Composition
  requirement: وجود مانیفست deploy/compose.yaml و پوشه تنظیمات deploy/config/ در ریشه سرویس جهت ادغام اختصاصی در کامپوز ریشه
    پروژه از طریق دستور بومی include:.
  check: static
  scope: service
  applies_to:
  - go-service
  - packaged-engine
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-009-service-owned-deployment-and-financial-ledger.md §۲.۱, dotdive/docs/lemmo/07-devops/docker-spec.md
    §۳.۳
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DEP-02
  name: Single Multi-Stage Dockerfile
  requirement: وجود دقیقاً یک فایل با نام Dockerfile در ریشه سرویس بر پایه الگوی چندمرحله‌ای (Multi-Stage) جهت تضمین ایمیج
    نهایی مینیمال و امن؛ منع داکرفایلهای موازی مانند dev.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/07-devops/docker-spec.md §۴
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DEP-03
  name: Role-Based Container Naming
  requirement: تنظیم صریح container_name با الگوی الزامی lemmo-svc-<name> در deploy/compose.yaml؛ ممنوعیت کاربرد نام ابزارها،
    برندهای ثالث یا نام‌های تجاری در نام کانتینر.
  check: static
  scope: service
  applies_to:
  - go-service
  - packaged-engine
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: compose_lint
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-009-service-owned-deployment-and-financial-ledger.md §۲.۳, dotdive/docs/lemmo/07-devops/docker-spec.md
    §۳.۲
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-DEP-04
  name: Build Provenance Startup Logging
  requirement: تزریق آرگومان‌های ARG GIT_COMMIT و ARG BUILD_TIME در زمان بیلد داکر و ثبت الزامی شناسه کامیت و زمان بیلد در
    اولین خط لاگ خروجی استارت سرویس در main.go.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: content_match
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/07-devops/docker-spec.md §۴
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-VER-01
  name: Authoritative Human Changelog
  requirement: وجود فایل CHANGELOG.md در ریشه هر سرویس بر مبنای استاندارد Keep a Changelog همراه با دسته‌بندی‌های رسمی مجاز
    (Added, Changed, Deprecated, Removed, Fixed, Security).
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-008-internal-tooling-and-versioning-governance.md §۲.۶
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-VER-02
  name: Semantic Versioning & Multi-Module Git Tag
  requirement: تبعیت نسخه سرویس از SemVer 2.0.0 و انطباق سیستم تگ‌گذاری گیت با الگوی چندماژوله services/<name>/vX.Y.Z جهت
    تفکیک چرخه‌های انتشار مستقل در مونوریپو.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: git_tags
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-008-internal-tooling-and-versioning-governance.md §۲.۳, dotdive/docs/lemmo/01-architecture/decisions/ADR-023-service-release-versioning-image-hygiene-and-generated-file-provenance.md
    §۲.۱
  doc_status: draft_source
  enforced_by: lemmo-cli check
- id: SB-IMG-01
  name: Version-Derived Docker Image Tagging
  requirement: استخراج تگ ایمیج داکر از نسخه سرویس با فرمت lemmo/svc-<name>:vX.Y.Z و اعمال سیاست نگه‌داری ۳ نسخه آخر و هرس
    ایمیج‌های آویزان (Dangling Images Pruning).
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: compose_lint
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-023-service-release-versioning-image-hygiene-and-generated-file-provenance.md
    §۲.۵
  doc_status: draft_source
  enforced_by: lemmo-cli check
- id: SB-HDR-01
  name: Generated File Provenance Header
  requirement: درج هدر چهارگانه غیرقابل‌ویرایش در کلیه فایل‌های تولیدی توسط ژنراتورها (ابزار تولیدکننده، نسخه، دستور و اخطار
    منع ویرایش دستی) و اعمال گیت تازگی Zero-Diff در خط بیلد.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: always
  automation: full
  implementation_status: not_started
  evaluation_mechanism: content_match
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-023-service-release-versioning-image-hygiene-and-generated-file-provenance.md
    §۲.۳
  doc_status: draft_source
  enforced_by: lemmo-cli check
- id: SB-CTR-01
  name: Protobuf Contracts Centralization & Buf Lint
  requirement: تمرکز قراردادهای Protobuf در contracts/lemmo/v1/ و ارجاع در مانیفست سرویس؛ ممنوعیت فایل proto محلی در سرویس
    و برقراری گیت‌های buf lint و buf breaking.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.networking.inbound_grpc_port != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: buf_lint_and_breaking
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/03-backend/contracts.md §۱, dotdive/docs/lemmo/01-architecture/decisions/ADR-007-backend-contracts-and-tooling-standards.md
    §۲
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CTR-02
  name: Domain OpenAPI Specification Single Ownership
  requirement: الزام وجود دقیقاً یک قرارداد contracts/openapi/<domain>/v1/openapi.yaml با مالکیت صریح برای هر سرویس دارای
    پورت ورودی HTTP؛ منع دور زدن قرارداد با تنظیم openapi_domain به null.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.networking.inbound_http_port != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: filesystem
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-016-request-context-governance-and-workspace-policy.md §۲.۱۴,
    dotdive/docs/lemmo/01-architecture/decisions/ADR-018-tools-platform-architecture-unified-execution-and-domain-decoupling.md
    §۲.۶
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CTR-03
  name: OpenAPI Operations Standards
  requirement: الزام تعیین operationId یکتا در سطح کل سیستم و متادیتای صریح حاکمیت دسترسی x-lemmo-workspace-policy (یکی از
    مقادیر required, optional, none) برای هر عملیات در OpenAPI.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.contracts.openapi_domain != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: openapi_lint
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-016-request-context-governance-and-workspace-policy.md §۲.۲
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CTR-04
  name: OpenAPI Breaking Changes Gate
  requirement: ممنوعیت اعمال هرگونه تغییر شکست‌دهنده یا ناسازگار در اندپوینت‌های عمومی OpenAPI بدون معرفی نسخه جدید API و
    ارزیابی خودکار تغییرات در خط بیلد با باینری oasdiff.
  check: static
  scope: platform
  applies_to:
  - go-service
  - packaged-engine
  applies_when: manifest.contracts.openapi_domain != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: oasdiff
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/03-backend/contracts.md §۴, dotdive/docs/lemmo/01-architecture/decisions/ADR-008-internal-tooling-and-versioning-governance.md
    §۲.۳
  doc_status: gap
  enforced_by: ci:oasdiff (proposed)
- id: SB-CTR-05
  name: HTTP Error Envelope Conformance & Mapping Ownership
  requirement: پاسخ‌های خطای HTTP باید به contracts/openapi/shared/errors.yaml (AIP-193 ErrorInfo / RFC 7807 + reason + help_key)
    ارجاع دهند؛ مالکیت انحصاری ترجمه خطای gRPC به HTTP در اختیار پکیج api/core/transport/http و پلاگین درگاه لبه Kong است.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.networking.inbound_http_port != null
  automation: partial
  implementation_status: not_started
  evaluation_mechanism: ast_and_contract_test
  roadmap_stage: 1
  gate: new_service
  doc_ref: dotdive/docs/lemmo/03-backend/style-guide.md §4, dotdive/docs/lemmo/03-backend/contracts.md §۵
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CTR-06
  name: Idempotency-Key Header Enforcement
  requirement: کلیه عملیات‌های تغییردهنده وضعیت (POST/PUT/PATCH) در سرویس دارای پورت ورودی HTTP موظف به اعلام هدر Idempotency-Key
    در قرارداد و سیم‌کشی میدل‌ور متمرکز core/idempotency هستند.
  check: static
  scope: service
  applies_to:
  - go-service
  applies_when: manifest.networking.inbound_http_port != null
  automation: partial
  implementation_status: not_started
  evaluation_mechanism: ast_and_contract_test
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-016-request-context-governance-and-workspace-policy.md §۲.۱۰
  doc_status: approved
  enforced_by: lemmo-cli check
- id: SB-CTR-07
  name: Two-Way Gateway-Contract Route Conformance
  requirement: 'انطباق دوطرفه روت‌های شبکه درگاه ورودی Kong با قراردادهای OpenAPI سرویس‌ها: هیچ روت گیت‌وی بدون قرارداد معتبر
    و هیچ قرارداد عمومی بدون روت متناظر در Kong مجاز نیست.'
  check: static
  scope: platform
  applies_to:
  - go-service
  - packaged-engine
  applies_when: manifest.contracts.openapi_domain != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: contract_lint
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-013-three-tier-edge-gateway-and-bff-architecture.md §۲.۱, dotdive/docs/lemmo/03-backend/contracts.md §۵
  doc_status: gap
  enforced_by: ci:gateway-route-conformance (proposed)
- id: SB-CTR-08
  name: Frontend SDK Client Freshness Zero-Diff Gate
  requirement: کدهای کلاینت تایپ‌اسکریپت تولیدی با Orval در مسیر app/src/sdk/generated/ نسبت به قراردادهای OpenAPI باید ۱۰۰٪
    بدون تغییر و انحراف باشند و در CI گیت Zero-Diff اجرا شود.
  check: static
  scope: platform
  applies_to:
  - go-service
  applies_when: manifest.contracts.openapi_domain != null
  automation: full
  implementation_status: not_started
  evaluation_mechanism: zero_diff
  roadmap_stage: 1
  gate: ratchet
  doc_ref: dotdive/docs/lemmo/01-architecture/decisions/ADR-016-request-context-governance-and-workspace-policy.md §۲.۱۴,
    dotdive/docs/lemmo/01-architecture/decisions/ADR-023-service-release-versioning-image-hygiene-and-generated-file-provenance.md
    §۲.۴
  doc_status: draft_source
  enforced_by: ci:frontend-sdk-zero-diff (proposed)
