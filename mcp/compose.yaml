services:
  dotdive-mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    image: dotdive-mcp:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3900}:3900"
    environment:
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://mcp.dotdive.ir}
      - MCP_OAUTH_SECRET=${MCP_OAUTH_SECRET:-}
    secrets:
      - source: dotdive_mcp_tokens
        target: dotdive-mcp-tokens.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3900/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

secrets:
  dotdive_mcp_tokens:
    file: ${MCP_TOKENS_FILE:?Set MCP_TOKENS_FILE to an absolute path for the token JSON}